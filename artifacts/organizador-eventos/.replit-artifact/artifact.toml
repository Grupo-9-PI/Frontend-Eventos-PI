kind = "web"
previewPath = "/"
title = "Organizador de Eventos"
description = "Frontend React para que organizadores independientes creen eventos y planes logísticos, consulten tareas de hoy y gestionen plazos en Sprint 0–1. Preparado para integrar más adelante una API externa."
version = "1.0.0"
id = "artifacts/organizador-eventos"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24582

[services.development]
run = "pnpm --filter @workspace/organizador-eventos run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/organizador-eventos", "run", "build" ]
serve = "static"
publicDir = "artifacts/organizador-eventos/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24582"
BASE_PATH = "/"
